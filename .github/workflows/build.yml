name: Build Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install MFC for VS 2022
      shell: pwsh
      run: |
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        
        Write-Host "正在安装 v143 MFC 库..."
        # 同时安装 x86/x64 和 ARM64 的 v143 MFC 组件（即对应 VC++ v170 工具集）
        $process = Start-Process -FilePath $installer -ArgumentList "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.14.38.17.8.MFC --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart" -PassThru -Wait
        
        Write-Host "安装完成，退出码: $($process.ExitCode)"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build all Solutions
      shell: pwsh
      run: |
        $slnFiles = Get-ChildItem -Recurse -Filter *.sln
        if ($slnFiles.Count -eq 0) {
            Write-Error "未找到任何 .sln 解决方案文件！"
            exit 1
        }
        foreach ($sln in $slnFiles) {
            Write-Host "----------------------------------------"
            Write-Host "正在编译解决方案: $($sln.FullName)"
            Write-Host "----------------------------------------"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform="x86"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform="x64"
        }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor-Plugins-DLLs
        path: |
          **/*.dll
          !**/obj/**
