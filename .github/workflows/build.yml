name: Build Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install C++ MFC Support
      shell: pwsh
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        Write-Host "正在后台静默安装 MFC 库，请稍候（预计耗时 2-5 分钟）..."
        $process = Start-Process -FilePath $installer -ArgumentList "modify", "--installPath", "`"$vsPath`"", "--add", "Microsoft.VisualStudio.Component.VC.ATLMFC", "--quiet", "--norestart" -PassThru -Wait
        Write-Host "MFC 安装完成，退出码: $($process.ExitCode)"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build all Solutions
      shell: pwsh
      run: |
        $slnFiles = Get-ChildItem -Recurse -Filter *.sln
        if ($slnFiles.Count -eq 0) {
            Write-Error "未找到任何 .sln 解决方案文件！"
            exit 1
        }
        foreach ($sln in $slnFiles) {
            Write-Host "----------------------------------------"
            Write-Host "正在编译解决方案: $($sln.FullName)"
            Write-Host "----------------------------------------"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform="x86"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform="x64"
        }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor-Plugins-DLLs
        path: |
          **/*.dll
          !**/obj/**
