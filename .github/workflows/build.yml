name: Build Plugins

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install C++ MFC Support
      shell: pwsh
      run: |
        $vsPath = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
        $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
        
        Write-Host "开始安装 VC++ v143 MFC 组件..."
        Start-Process -FilePath $installer -ArgumentList "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart" -Wait
        
        # 关键步骤：强制等待后台安装引擎 vs_setup_engine 彻底结束
        Write-Host "等待后台安装进程写入完成..."
        while (Get-Process -Name "vs_installer", "vs_setup_engine" -ErrorAction SilentlyContinue) {
            Start-Sleep -Seconds 5
        }
        Write-Host "MFC 组件安装完成！"

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build all Solutions
      shell: pwsh
      run: |
        $slnFiles = Get-ChildItem -Recurse -Filter *.sln
        if ($slnFiles.Count -eq 0) {
            Write-Error "未找到任何 .sln 解决方案文件！"
            exit 1
        }
        foreach ($sln in $slnFiles) {
            Write-Host "----------------------------------------"
            Write-Host "正在编译解决方案: $($sln.FullName)"
            Write-Host "----------------------------------------"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform="x86"
            msbuild $sln.FullName /p:Configuration=Release /p:Platform="x64"
        }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor-Plugins-DLLs
        path: |
          **/*.dll
          !**/obj/**
